name: Deploy Ninja RPG
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: test -f public/assets/floot-village.png && test -f public/assets/floot-player.png && test -f public/assets/floot-battle.png
      - run: npm run build -- --base=/ninja-rpg2/
      - run: test -f dist/assets/floot-village.png && test -f dist/assets/floot-player.png && test -f dist/assets/floot-battle.png
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
